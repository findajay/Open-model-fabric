# Optional: dedicated GPU inference with vLLM's OpenAI-compatible server. The platform
# talks to it through the generic `openai_compatible` adapter — no vLLM-specific code.
# Requires nodes with NVIDIA GPUs and the NVIDIA device plugin.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  labels: {app.kubernetes.io/name: vllm}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: vllm}
  template:
    metadata:
      labels: {app.kubernetes.io/name: vllm}
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.32.0
          args: ["--model", "Qwen/Qwen2.5-0.5B-Instruct", "--port", "8000", "--api-key", "$(VLLM_API_KEY)"]
          env:
            - name: VLLM_API_KEY
              valueFrom: {secretKeyRef: {name: omf-secrets, key: VLLM_API_KEY}}
          ports: [{containerPort: 8000}]
          resources:
            limits: {nvidia.com/gpu: 1}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
spec:
  selector: {app.kubernetes.io/name: vllm}
  ports: [{port: 8000, targetPort: 8000}]
