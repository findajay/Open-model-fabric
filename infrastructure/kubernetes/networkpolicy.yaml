# Default-deny egress for the API, then allow only DNS, the in-cluster vLLM service and
# PostgreSQL. This backs up the application-level SSRF egress policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omf-api-egress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: omf-api}
  policyTypes: [Egress]
  egress:
    - to: [{namespaceSelector: {}, podSelector: {matchLabels: {k8s-app: kube-dns}}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: vllm}}}]
      ports: [{port: 8000, protocol: TCP}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: postgres}}}]
      ports: [{port: 5432, protocol: TCP}]
