name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync --frozen --all-extras
      - run: pnpm install --frozen-lockfile
      - name: Verify before releasing
        run: make check
      - name: Build Python wheel/sdist, SDK and web app
        run: |
          uv build
          pnpm --filter @omf/sdk build
          pnpm --filter @omf/sdk pack --pack-destination dist
          pnpm --filter @omf/web build
          tar -czf dist/open-model-fabric-web-${GITHUB_REF_NAME}.tar.gz -C apps/web/dist .
          cp packages/contracts/openapi.json dist/openapi-${GITHUB_REF_NAME}.json
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/open-model-fabric
          tags: type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
