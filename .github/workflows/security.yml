name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: uv sync --frozen --all-extras
      - run: pnpm install --frozen-lockfile
      - run: make audit

  dependency-review:
    name: Dependency review (new dependencies in PRs)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0

  no-weights-or-secrets:
    name: No model weights or obvious secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reject model weight files
        run: |
          if git ls-files | grep -Ei '\.(safetensors|gguf|bin|pt|pth|onnx|ckpt)$'; then
            echo "Model weights must not be committed (see docs/providers/model-licensing.md)"; exit 1
          fi
      - name: Reject private keys and common token formats
        run: |
          if git grep -nE -- '-----BEGIN [A-Z ]*PRIVATE KEY-----|sk-[A-Za-z0-9]{32,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}' -- ':!*.lock' ':!pnpm-lock.yaml'; then
            echo "Possible secret committed"; exit 1
          fi
