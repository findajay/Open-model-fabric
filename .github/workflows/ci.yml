name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} (lint, types, tests, PostgreSQL)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omf_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # CI-only throwaway credentials for the service container above.
      OMF_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/omf_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv sync --frozen --all-extras --python ${{ matrix.python }}
      - run: uv run ruff check python apps/api tests scripts
      - run: uv run ruff format --check python apps/api tests scripts
      - run: uv run mypy
      - run: uv run pytest -q

  web:
    name: Web + SDK (lint, types, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm format:check
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @omf/web build
      - run: pnpm --filter @omf/example-react-chat build

  contracts:
    name: OpenAPI contract and SDK are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync --frozen --all-extras
      - run: pnpm install --frozen-lockfile
      - run: make contracts-check

  e2e:
    name: End-to-end (mock -> Ollama -> OpenAI-compatible provider switch)
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync --frozen --all-extras
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @omf/web exec playwright install --with-deps chromium
      - run: pnpm --filter @omf/web e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          push: false
          tags: open-model-fabric:ci
      - name: Compose file is valid
        run: OMF_ADMIN_TOKEN=ci-placeholder-token docker compose -f infrastructure/compose/docker-compose.yml config -q
